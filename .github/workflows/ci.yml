name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # `next build` needs these to be present, but never contacts a real
      # service: pages that fetch at build time fail soft and render empty.
      - name: Build
        run: yarn build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
